<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - SecureCloud Share</title>
  <link rel="stylesheet" href="../css/site.css" />
</head>
<body data-role="public">

  <main class="container" style="max-width:420px;">
    <div class="card">
      <h2>Login</h2>
      <form id="loginForm" novalidate>
        <div class="form-row">
          <label for="username">Username</label>
          <input type="text" id="username" />
          <span class="error-text" id="err-username"></span>
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" />
          <span class="error-text" id="err-password"></span>
        </div>
        <button type="submit" class="btn">Login</button>
        <p>New user? <a href="Register.html">Register here</a></p>
      </form>
    </div>
  </main>

  <script src="../js/layout.js"></script>
  <script src="../js/validate.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      if (validateLogin(this)) {
        // DEMO ONLY: Person 3 replaces this with the real login check.
        sessionStorage.setItem("username", val("username"));
        window.location.href = "MyFiles.html";
      }
    });
  </script>
</body>
</html>
