<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared With Me - SecureCloud Share</title>
  <link rel="stylesheet" href="../css/site.css" />
</head>
<body data-role="user">

  <main class="container">
    <div class="card">
      <h2>Files shared with me</h2>
      <table class="data-table">
        <tr>
          <th>File name</th>
          <th>Shared by</th>
          <th>Shared on</th>
          <th>Integrity status</th>
          <th>Action</th>
        </tr>
        <tr>
          <td>notes.pdf</td>
          <td>asha</td>
          <td>26 Oct 2026</td>
          <td><span class="badge badge-ok">Verified</span></td>
          <td><button class="btn">Download</button></td>
        </tr>
        <tr>
          <td>budget.xlsx</td>
          <td>bala</td>
          <td>24 Oct 2026</td>
          <td><span class="badge badge-bad">Tampered</span></td>
          <td><button class="btn">Download</button></td>
        </tr>
      </table>
    </div>
  </main>

  <script src="../js/layout.js"></script>
</body>
</html>
