<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Change Password - SecureCloud Share</title>
  <link rel="stylesheet" href="../css/site.css" />
</head>
<body data-role="user">

  <main class="container" style="max-width:480px;">
    <div class="card">
      <h2>Change password</h2>
      <form id="passwordForm" novalidate>
        <div class="form-row">
          <label for="oldpass">Current password</label>
          <input type="password" id="oldpass" />
          <span class="error-text" id="err-oldpass"></span>
        </div>
        <div class="form-row">
          <label for="newpass">New password</label>
          <input type="password" id="newpass" />
          <span class="error-text" id="err-newpass"></span>
        </div>
        <div class="form-row">
          <label for="confirm">Confirm new password</label>
          <input type="password" id="confirm" />
          <span class="error-text" id="err-confirm"></span>
        </div>
        <button type="submit" class="btn">Update password</button>
        <a href="Profile.html" style="margin-left:12px;">Back to profile</a>
      </form>
    </div>
  </main>

  <script src="../js/layout.js"></script>
  <script src="../js/validate.js"></script>
  <script>
    document.getElementById("passwordForm").addEventListener("submit", function (e) {
      e.preventDefault();
      if (validateChangePassword(this)) {
        // DEMO ONLY: Person 3 replaces this with the real password check and update.
        alert("Password changed successfully!");
        window.location.href = "Profile.html";
      }
    });
  </script>
</body>
</html>
