<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Activity Logs - SecureCloud Share</title>
  <link rel="stylesheet" href="../css/site.css" />
</head>
<body data-role="user">

  <main class="container">
    <div class="card">
      <h2>My activity logs</h2>
      <table class="data-table">
        <tr>
          <th>File name</th>
          <th>Action</th>
          <th>Date and time</th>
        </tr>
        <tr>
          <td>notes.pdf</td>
          <td>Downloaded</td>
          <td>26 Oct 2026, 7:10 PM</td>
        </tr>
        <tr>
          <td>marks.pdf</td>
          <td>Viewed</td>
          <td>26 Oct 2026, 6:45 PM</td>
        </tr>
        <tr>
          <td>budget.xlsx</td>
          <td>Viewed</td>
          <td>25 Oct 2026, 9:30 AM</td>
        </tr>
      </table>
    </div>
  </main>

  <script src="../js/layout.js"></script>
</body>
</html>
